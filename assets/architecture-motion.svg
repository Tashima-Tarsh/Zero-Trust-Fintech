<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cardActiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c2340" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .label-code { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 10px; fill: #38bdf8; }
      .pulse-dot { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -320; }
      }
    </style>

    <!-- Connection Paths for Particle Animation -->
    <path id="path1" d="M 160 230 C 220 230, 220 120, 280 120" />
    <path id="path2" d="M 400 120 C 460 120, 460 340, 380 340" />
    <path id="path3" d="M 400 340 C 450 340, 470 230, 520 230" />
    <path id="path4" d="M 640 230 L 760 230" />
    <path id="path5" d="M 880 230 C 920 230, 920 230, 940 230" />
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="460" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="400" x2="960" y2="400" />
    <line x1="160" y1="0" x2="160" y2="460" />
    <line x1="320" y1="0" x2="320" y2="460" />
    <line x1="480" y1="0" x2="480" y2="460" />
    <line x1="640" y1="0" x2="640" y2="460" />
    <line x1="800" y1="0" x2="800" y2="460" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 36)">
    <rect width="360" height="30" rx="15" fill="#1e293b" opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19" class="label-title" font-size="11" fill="#38bdf8">LIVE PAYMENT ORCHESTRATION PIPELINE</text>
    <text x="265" y="19" class="label-code" font-size="10" fill="#a78bfa">&lt; 1s LATENCY</text>
  </g>

  <!-- Metric Badges Top Right -->
  <g transform="translate(680, 36)">
    <rect width="120" height="28" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" opacity="0.9" />
    <text x="14" y="18" class="label-title" font-size="10" fill="#10b981">● 0% MDR FEES</text>

    <rect x="130" width="120" height="28" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <text x="144" y="18" class="label-title" font-size="10" fill="#818cf8">● MERKLE LEDGER</text>
  </g>

  <!-- ==================== FLOW WIRES ==================== -->
  <g fill="none" stroke="#334155" stroke-width="2">
    <!-- Path 1: Customer PWA to UPI Intent -->
    <path d="M 160 230 C 220 230, 220 120, 280 120" />
    <!-- Path 2: UPI Intent to Web Share Target -->
    <path d="M 400 120 C 460 120, 460 340, 380 340" />
    <!-- Path 3: Web Share Target to Forensic Engine -->
    <path d="M 400 340 C 450 340, 470 230, 520 230" />
    <!-- Path 4: Forensic Engine to Merkle Ledger -->
    <path d="M 640 230 L 760 230" />
  </g>

  <!-- Animated Glowing Dash Overlays -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 160 230 C 220 230, 220 120, 280 120" stroke="#38bdf8" opacity="0.7" class="dash-flow" />
    <path d="M 400 120 C 460 120, 460 340, 380 340" stroke="#f59e0b" opacity="0.7" class="dash-flow" />
    <path d="M 400 340 C 450 340, 470 230, 520 230" stroke="#10b981" opacity="0.7" class="dash-flow" />
    <path d="M 640 230 L 760 230" stroke="#6366f1" opacity="0.8" class="dash-flow" />
  </g>

  <!-- Animated Flying Packets (Motion Particles) -->
  <!-- Particle 1: Intent Launch (Cyan) -->
  <circle r="4" fill="#38bdf8" filter="url(#cyanGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 160 230 C 220 230, 220 120, 280 120" />
  </circle>

  <!-- Particle 2: Receipt Share (Amber) -->
  <circle r="4" fill="#f59e0b" filter="url(#cyanGlow)">
    <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M 400 120 C 460 120, 460 340, 380 340" />
  </circle>

  <!-- Particle 3: Ingestion to Verification (Emerald) -->
  <circle r="4.5" fill="#10b981" filter="url(#emeraldGlow)">
    <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M 400 340 C 450 340, 470 230, 520 230" />
  </circle>

  <!-- Particle 4: Settlement Commitment (Purple) -->
  <circle r="5" fill="#a78bfa" filter="url(#cyanGlow)">
    <animateMotion dur="1.8s" begin="2.0s" repeatCount="indefinite" path="M 640 230 L 760 230" />
  </circle>

  <!-- ==================== STATIONS / NODES ==================== -->

  <!-- NODE 1: Customer Browser PWA (Left) -->
  <g transform="translate(40, 165)" filter="url(#dropShadow)">
    <rect width="140" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="140" height="28" rx="12" fill="#1e293b" />
    <rect y="16" width="140" height="12" fill="#1e293b" />
    
    <circle cx="16" cy="14" r="4" fill="#ef4444" />
    <circle cx="28" cy="14" r="4" fill="#f59e0b" />
    <circle cx="40" cy="14" r="4" fill="#10b981" />
    <text x="54" y="17" class="label-title" font-size="10" fill="#94a3b8">Customer PWA</text>

    <text x="14" y="52" class="label-title">1. Checkout</text>
    <text x="14" y="68" class="label-sub">Zero native install</text>

    <!-- Dynamic Challenge Box -->
    <rect x="12" y="78" width="116" height="38" rx="6" fill="#0b1329" stroke="#38bdf8" stroke-width="0.8" />
    <text x="18" y="93" class="label-code">₹100.37 (Paise)</text>
    <text x="18" y="107" class="label-code" fill="#64748b">TTL: 180s Active</text>
  </g>

  <!-- NODE 2: UPI Intent Rail (Top Middle) -->
  <g transform="translate(280, 60)" filter="url(#dropShadow)">
    <rect width="130" height="110" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="130" height="24" rx="12" fill="#1e293b" />
    <rect y="12" width="130" height="12" fill="#1e293b" />

    <text x="14" y="16" class="label-title" font-size="10" fill="#f59e0b">⚡ NPCI UPI Rail</text>
    <text x="14" y="44" class="label-title">2. Intent Pay</text>
    <text x="14" y="60" class="label-sub">GPay / PhonePe / BHIM</text>

    <rect x="12" y="70" width="106" height="26" rx="6" fill="#171e2e" stroke="#475569" stroke-width="0.8" />
    <text x="18" y="86" class="label-code" fill="#fcd34d">Direct Bank Settlement</text>
  </g>

  <!-- NODE 3: Web Share Target (Bottom Middle) -->
  <g transform="translate(270, 285)" filter="url(#dropShadow)">
    <rect width="140" height="110" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="140" height="24" rx="12" fill="#1e293b" />
    <rect y="12" width="140" height="12" fill="#1e293b" />

    <text x="14" y="16" class="label-title" font-size="10" fill="#10b981">📲 Web Share Target</text>
    <text x="14" y="44" class="label-title">3. Share Receipt</text>
    <text x="14" y="60" class="label-sub">POST /handle-share</text>

    <rect x="12" y="70" width="116" height="26" rx="6" fill="#171e2e" stroke="#10b981" stroke-width="0.8" />
    <text x="18" y="86" class="label-code" fill="#6ee7b7">Service Worker SW</text>
  </g>

  <!-- NODE 4: 5-Layer Forensic Engine (Center Right) -->
  <g transform="translate(500, 145)" filter="url(#dropShadow)">
    <rect width="160" height="170" rx="12" fill="url(#cardActiveGrad)" stroke="#6366f1" stroke-width="2" />
    
    <!-- Header -->
    <rect width="160" height="30" rx="12" fill="#1e1b4b" />
    <rect y="18" width="160" height="12" fill="#1e1b4b" />
    <text x="14" y="20" class="label-title" font-size="11" fill="#c7d2fe">🛡️ 5-Layer Forensic Engine</text>

    <!-- Radar Pulse Wave around Center -->
    <circle cx="80" cy="85" r="28" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="16;38;16" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="85" r="14" fill="#4f46e5" opacity="0.9" />
    <text x="73" y="89" font-size="12" fill="#fff">✓</text>

    <!-- Layer Details -->
    <text x="14" y="124" class="label-code" fill="#a5b4fc">L1: Julian Day (YDDDHH)</text>
    <text x="14" y="138" class="label-code" fill="#a5b4fc">L2: Atomic Lua Challenge</text>
    <text x="14" y="152" class="label-code" fill="#a5b4fc">L3: Redis Replay Deduplication</text>
    <text x="14" y="166" class="label-code" fill="#34d399">L4-L5: Note &amp; Session TTL</text>
  </g>

  <!-- NODE 5: Merkle Ledger & Merchant Soundbox (Right) -->
  <g transform="translate(740, 160)" filter="url(#dropShadow)">
    <rect width="180" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Header -->
    <rect width="180" height="28" rx="12" fill="#064e3b" />
    <rect y="16" width="180" height="12" fill="#064e3b" />
    <text x="14" y="18" class="label-title" font-size="10" fill="#6ee7b7">⛓️ Immutable Merkle Ledger</text>

    <text x="14" y="46" class="label-title">4. Settlement &amp; Alert</text>
    <text x="14" y="62" class="label-sub">pg_advisory_xact_lock</text>

    <!-- Block representation -->
    <rect x="12" y="74" width="156" height="26" rx="6" fill="#022c22" stroke="#10b981" stroke-width="0.8" />
    <text x="18" y="90" class="label-code" fill="#34d399">Block #104 Committed</text>

    <!-- Soundbox Chime Trigger -->
    <rect x="12" y="104" width="156" height="24" rx="6" fill="#1e293b" />
    <circle cx="22" cy="116" r="4" fill="#10b981">
      <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="119" class="label-title" font-size="10" fill="#38bdf8">🔊 WebSocket Soundbox &lt; 1s</text>
  </g>

  <!-- Bottom Timeline Progress Bar -->
  <g transform="translate(60, 420)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="840" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="140, 700">
      <animate attributeName="stroke-dashoffset" values="840;-840" dur="4s" repeatCount="indefinite" />
    </line>
    <text x="0" y="-8" class="label-code" fill="#64748b">0ms - Intent Open</text>
    <text x="260" y="-8" class="label-code" fill="#64748b">350ms - Bank Handshake</text>
    <text x="520" y="-8" class="label-code" fill="#64748b">650ms - 5-Layer Math Audit</text>
    <text x="760" y="-8" class="label-code" fill="#10b981">920ms - Confirmed</text>
  </g>
</svg>