# ══════════════════════════════════════════════════════════════════════════════
# DISHA 8.2 — ZERO-TRUST FINTECH RENDER BLUEPRINT (INFRASTRUCTURE-AS-CODE)
# ══════════════════════════════════════════════════════════════════════════════
# Fully automated production deployment on Render.com:
# - Managed PostgreSQL 15 Ledger Database
# - Managed Redis 7 In-Memory Challenge Store
# - FastAPI Zero-Trust Backend (Docker runtime)
# - DISHA Sovereign Customer Checkout Gateway (Node 22)
# - DISHA Merchant SaaS Platform & Audio Soundbox (Node 22 + Persistent Disk)
# ══════════════════════════════════════════════════════════════════════════════

databases:
  - name: disha-postgres
    databaseName: zerotrust_ledger
    user: zerotrust
    plan: starter
    region: frankfurt
    ipAllowList: []

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Managed Redis Cache (Challenge Token Nonces & Rate Limiting)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: redis
    name: disha-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. DISHA Sovereign Customer Checkout Gateway (Port 3000 Web App)
  #     Integrated UPI-to-UPI checkout + verify + ledger + WebSocket confirmations
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: disha-checkout
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: disha-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: disha-redis
          type: redis
          property: connectionString
      - key: MERCHANT_UPI_ID
        value: "nkumar906099-7@oksbi"
      - key: MERCHANT_NAME
        value: "Nitish Enterprise"
      - key: ENABLE_PAYMENT_SIMULATION
        value: "false"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DISHA Merchant SaaS Platform & Soundbox (Port 5000 Web App)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: disha-merchant-saas
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: disha-cinematic
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: disha-saas-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: disha-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: disha-redis
          type: redis
          property: connectionString
      - key: DATA_DIR
        value: /data
      - key: ENABLE_PAYMENT_SIMULATION
        value: "false"

# NOTE: The Python/FastAPI "zero-trust-fintech-production" twin is a reference
# implementation that is NOT wired into the Node checkout flow. Do not deploy it
# as part of this blueprint until it is integrated. When ready, add it as a
# separate web service with JWT_SECRET_KEY/SECRET_KEY provided via Render env
# (never hardcoded) and APP_ENV=production.
