<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-Trust Auto-Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">
    <div id="app" class="text-center">
        <h1 class="text-2xl font-bold">Pay ₹499</h1>
        <p class="text-gray-400 mt-2">Tap to open UPI App. We'll verify automatically.</p>
        
        <a id="upi-link" href="#" class="block bg-emerald-600 p-4 rounded mt-6 font-bold shadow-lg shadow-emerald-900/50">
            OPEN UPI & PAY
        </a>

        <div id="status" class="mt-6 hidden">
            <div class="animate-pulse text-emerald-400">Verifying Transaction...</div>
        </div>
    </div>

    <script type="module">
        import sdk from './sensors/WebTelemetrySDK.js';

        // 1. Generate Link with Unique Transaction Ref
        const sessionId = "SES-" + Math.random().toString(36).substr(2, 9);
        const vpa = "merchant001@oksbi";
        const tr = "TR-" + Date.now();
        
        // The 'cu' and 'tn' are standard NPCI params
        const upiLink = `upi://pay?pa=${vpa}&am=499&tn=${sessionId}&tr=${tr}&cu=INR`;
        
        document.getElementById('upi-link').href = upiLink;

        // 2. Monitor for Return from UPI App
        window.addEventListener('pageshow', (event) => {
            if (event.persisted || document.visibilityState === 'visible') {
                // User has returned from GPay/PhonePe
                checkPaymentStatus(sessionId, tr);
            }
        });

        async function checkPaymentStatus(sessionId, tr) {
            document.getElementById('status').classList.remove('hidden');
            
            // Send Telemetry + Transaction Ref to N8N
            const payload = {
                session_id: sessionId,
                transaction_ref: tr,
                telemetry: sdk.getPayload(),
                device_fingerprint: navigator.userAgent
            };

            try {
                const res = await fetch('https://your-n8n-instance/webhook/auto-verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if(data.status === 'verified') {
                    document.getElementById('app').innerHTML = "<h1 class='text-emerald-400'>Payment Verified! ✅</h1>";
                } else {
                    // FALLBACK: Only if automation fails, show upload
                    document.getElementById('app').innerHTML = "<p>Auto-verify failed. Please upload screenshot.</p><input type='file'>";
                }
            } catch (e) {
                console.error("Verification Error", e);
            }
        }
    </script>
</body>
</html>
