plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'ai.disha.credentialfixture'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.disha.credentialfixture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-fixture-only'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    // Matched published IdentityCredentialClient.registerCredentials() status-17 reproduction.
    // Controlled dependency experiment; CI must prove whether it resolves registration.
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.credentials.registry:registry-provider:1.0.0-alpha05'
    implementation 'androidx.credentials.registry:registry-provider-play-services:1.0.0-alpha05'
    implementation 'androidx.credentials.registry:registry-digitalcredentials-openid:1.0.0-alpha05'
    implementation 'androidx.credentials.registry:registry-digitalcredentials-sdjwtvc:1.0.0-alpha05'
}
