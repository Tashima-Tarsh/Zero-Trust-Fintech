plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'ai.disha.testupi'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.disha.testupi.paymentfixture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-synthetic-only'
        manifestPlaceholders = [fixturePaymentMethod: providers.gradleProperty('fixturePaymentMethod')
            .getOrElse('https://localhost:18767/pay')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
