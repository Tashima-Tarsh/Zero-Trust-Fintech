<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePay - Pay with UPI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
    button { background: #1a73e8; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; }
    button:hover { background: #1557b0; }
    .amount { font-size: 32px; font-weight: bold; text-align: center; margin: 20px 0; }
    .status { text-align: center; margin-top: 20px; color: #666; }
  </style>
</head>
<body>
  <h1>SharePay Checkout</h1>
  <div class="amount" id="amount">Loading...</div>
  <button id="payBtn" onclick="startPayment()">Pay with UPI</button>
  <div class="status" id="status"></div>
  
  <script>
    let orderId, amount, upiLink;
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
    
    // Create order on page load
    async function init() {
      const response = await fetch('/api/create-order', { method: 'POST' });
      const data = await response.json();
      
      orderId = data.orderId;
      amount = data.amount;
      upiLink = data.upiLink;
      
      document.getElementById('amount').textContent = '₹' + amount;
      
      // Connect WebSocket
      const ws = new WebSocket(`ws://${location.host}?orderId=${orderId}`);
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'SUCCESS') {
          window.location.href = `/success?utr=${data.utr}`;
        }
      };
      
      // Start 3-minute timeout
      setTimeout(() => {
        document.getElementById('status').textContent = 'Session expired';
      }, 3 * 60 * 1000);
    }
    
    function startPayment() {
      document.getElementById('status').textContent = 'Opening UPI app...';
      window.location.href = upiLink;
    }
    
    init();
  </script>
</body>
</html>
