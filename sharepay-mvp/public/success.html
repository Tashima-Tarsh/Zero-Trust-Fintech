<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Confirmed - SharePay</title>
  <style>
    :root {
      --primary: #1a73e8;
      --success: #1e8e3e;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: var(--surface); width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px 24px; text-align: center; }
    .icon-wrap { width: 72px; height: 72px; background: #e6f4ea; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--success); font-size: 36px; }
    h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
    p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .info-table { background: #f8f9fa; border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 24px; font-size: 14px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .info-row:last-child { margin-bottom: 0; }
    .label { color: var(--text-muted); }
    .val { font-weight: 600; font-family: monospace; }
    .btn { display: inline-block; background: var(--primary); color: white; padding: 14px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">✓</div>
    <h1>Payment Verified!</h1>
    <p>Zero-trust 5-layer cryptographic verification completed successfully.</p>

    <div class="info-table">
      <div class="info-row">
        <span class="label">Status:</span>
        <span class="val" style="color: var(--success)">SETTLED</span>
      </div>
      <div class="info-row">
        <span class="label">Order ID:</span>
        <span class="val" id="orderId">-</span>
      </div>
      <div class="info-row">
        <span class="label">NPCI UTR:</span>
        <span class="val" id="utr">-</span>
      </div>
      <div class="info-row">
        <span class="label">Audit Check:</span>
        <span class="val" style="color: var(--success)">FRESH & UNIQUE</span>
      </div>
    </div>

    <a href="/" class="btn">Done & Return Home</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('orderId').textContent = params.get('orderId') || 'Order_LIVE';
    document.getElementById('utr').textContent = params.get('utr') || 'N/A';
  </script>
</body>
</html>
