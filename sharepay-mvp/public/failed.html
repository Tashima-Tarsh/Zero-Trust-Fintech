<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; }
    .failed { color: #dc3545; font-size: 48px; }
    .reason { background: #fff3cd; padding: 10px; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="failed">✗</div>
  <h1>Payment Failed</h1>
  <div class="reason">
    <strong>Reason:</strong> <span id="reason"></span>
  </div>
  <a href="/">Try Again</a>
  
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('reason').textContent = params.get('reason') || 'Unknown error';
  </script>
</body>
</html>
