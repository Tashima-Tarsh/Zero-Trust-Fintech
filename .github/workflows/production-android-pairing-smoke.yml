name: DISHA production Android pairing smoke
on:
  push:
    branches:
      - verify/production-android-pairing-20261122
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-android-pairing-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed checkout and fail-closed pairing without moving money
        env:
          BASE_URL: https://disha8-2.thenitishkr.in
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsS "${BASE_URL}/api/health" > health.json
          grep -q '"status":"healthy"' health.json
          curl --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 35 -fsS "${BASE_URL}/api/runtime-assets/cosmic-checkout.js" > checkout.js
          grep -Fq "Connect Android debit observer" checkout.js
          http_code="$(curl --retry 2 --connect-timeout 10 --max-time 35 -sS -o rejection.json -w '%{http_code}' \
            -X POST "${BASE_URL}/api/session-evidence/pairing/redeem" \
            -H 'Content-Type: application/json' -H 'Cache-Control: no-store' \
            --data '{"ticket":"invalid"}')"
          echo "Invalid ticket HTTP status: ${http_code}"
          test "${http_code}" = 400
          grep -Fq 'PAIRING_TICKET_INVALID' rejection.json
          echo "PASS: live production serves updated checkout and rejects malformed Android pairing tickets"
          echo "NOTE: no real Android event, trusted OS provenance, or bank debit was tested."
