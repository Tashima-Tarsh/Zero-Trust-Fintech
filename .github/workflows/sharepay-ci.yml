name: SharePay PWA CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sharepay-mvp/**'
      - 'merchant-pwa/**'
      - '.github/workflows/sharepay-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sharepay-mvp/**'
      - 'merchant-pwa/**'

jobs:
  test:
    name: Test SharePay MVP & Merchant PWA
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run SharePay Attack Matrix Tests (8/8 Tests)
        run: |
          npm test --prefix sharepay-mvp
      
      - name: Run Merchant PWA Test Suite (7/7 Tests)
        run: |
          node merchant-pwa/test.js
