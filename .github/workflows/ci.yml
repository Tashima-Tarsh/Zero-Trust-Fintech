name: DISHA 8.2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install disha-cinematic dependencies
        run: npm ci
        working-directory: disha-cinematic

      - name: Run lint (syntax check)
        run: npm run lint

      - name: Start checkout server (port 3000)
        run: npm start &
        env:
          PORT: 3000
          NODE_ENV: test

      - name: Start merchant SaaS server (port 5000)
        run: npm start &
        working-directory: disha-cinematic
        env:
          PORT: 5000
          NODE_ENV: test
          DATA_DIR: ./data

      - name: Wait for servers to be healthy
        run: |
          for i in $(seq 1 30); do
            r3000=$(curl -s http://localhost:3000/health 2>/dev/null || true)
            r5000=$(curl -s http://localhost:5000/health 2>/dev/null || true)
            if [ -n "$r3000" ] && [ -n "$r5000" ]; then
              echo "Both servers healthy"
              break
            fi
            echo "Waiting for servers... attempt $i"
            sleep 2
          done
          if [ -z "$r3000" ] || [ -z "$r5000" ]; then
            echo "Servers not healthy in time"
            exit 1
          fi

      - name: Run test suite
        run: npm test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disha-test-screenshots
          path: |
            test-artifacts/verify-touch-*.png
            test-artifacts/verify-*.png
          retention-days: 7