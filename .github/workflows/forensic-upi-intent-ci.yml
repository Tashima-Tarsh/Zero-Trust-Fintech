name: Forensic UPI Intent CI
on:
  push:
    paths:
      - "forensic-upi-intent-engine/**"
      - ".github/workflows/forensic-upi-intent-ci.yml"
  pull_request:
    paths:
      - "forensic-upi-intent-engine/**"
      - ".github/workflows/forensic-upi-intent-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forensic-upi-intent-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Python compile
        run: python -m compileall -q backend scripts
      - name: Python unit tests
        run: python -m pytest backend/tests -q
      - name: Structure, JSON, safety invariants
        run: python scripts/validate_structure.py
      - name: Docker Compose configuration
        run: docker compose -f infra/docker-compose.yml --env-file .env.example config --quiet
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Web JavaScript syntax
        run: node --check web-fallback/script.js
