name: Android Credential Holder fixture build
on:
  push:
    branches:
      - experiment/android-credential-provider-fixture
  pull_request:
    paths:
      - 'tests/android/credential-holder-fixture/**'
      - '.github/workflows/android-credential-holder-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify signed SMS observation is never a bank receipt
        run: node tests/test-sms-observation.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test notification evidence against the session router and PostgreSQL
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix tests/android/credential-holder-fixture/session-lab
          node tests/android/credential-holder-fixture/session-lab/test.js
      - name: Compile Android Credential Manager holder fixture
        run: gradle -p tests/android/credential-holder-fixture :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: disha-credential-fixture-debug
          path: tests/android/credential-holder-fixture/app/build/outputs/apk/debug/*.apk
          retention-days: 7
