name: Android Credential Holder fixture build
on:
  push:
    branches:
      - experiment/android-credential-provider-fixture
  pull_request:
    paths:
      - 'tests/android/credential-holder-fixture/**'
      - '.github/workflows/android-credential-holder-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android Credential Manager holder fixture
        run: gradle -p tests/android/credential-holder-fixture :app:assembleDebug --no-daemon --console=plain
      - name: Upload research-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: disha-credential-fixture-debug
          path: tests/android/credential-holder-fixture/app/build/outputs/apk/debug/*.apk
          retention-days: 7
