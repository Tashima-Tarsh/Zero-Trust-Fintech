name: Android Credential Holder fixture build
on:
  push:
    branches:
      - experiment/android-credential-provider-fixture
  pull_request:
    paths:
      - 'tests/android/credential-holder-fixture/**'
      - '.github/workflows/android-credential-holder-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-holder:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android Credential Manager holder fixture
        run: gradle -p tests/android/credential-holder-fixture :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: disha-credential-fixture-debug
          path: tests/android/credential-holder-fixture/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  browser-android-handshake:
    needs: compile-holder
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated test holder
        run: gradle -p tests/android/credential-holder-fixture :app:assembleDebug --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Chrome → Android Credential Manager → holder test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-options: -no-snapshot -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/android/credential-holder-fixture/emulator-handshake.sh
      - name: Upload handshake logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disha-credential-android-handshake
          path: test-results/credential-handshake/**
          retention-days: 7
          if-no-files-found: warn
