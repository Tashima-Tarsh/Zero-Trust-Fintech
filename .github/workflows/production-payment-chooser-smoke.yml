name: Production payment chooser release smoke
on:
  push:
    branches:
      - main
    paths:
      - public/try-checkout.js
      - public/payment-modes.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-chooser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live P2P chooser passes ProofBridge opt-in and P2M stays separate
        env:
          DISHA_SMOKE_URL: https://disha8-2.thenitishkr.in
        run: node tests/production-payment-chooser-smoke.js
