name: Android Session Evidence

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-session-evidence.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-session-evidence.yml"

permissions:
  contents: read

jobs:
  build-session-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android evidence library
        working-directory: android
        run: gradle --no-daemon :session-evidence:assembleDebug
