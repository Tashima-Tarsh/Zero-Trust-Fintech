name: Android Session Evidence

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-session-evidence.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-session-evidence.yml"

permissions:
  contents: read

jobs:
  build-session-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK Platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android evidence library
        working-directory: android
        run: gradle --no-daemon :session-evidence:assembleDebug :upi-host:assembleDebug :upi-host:testDebugUnitTest

      - name: Upload debug host APK
        uses: actions/upload-artifact@v4
        with:
          name: disha-upi-host-debug-apk
          path: android/upi-host/build/outputs/apk/debug/*.apk
          if-no-files-found: error
