name: PostgreSQL financial invariants

on:
  pull_request:
    paths:
      - 'financial/**'
      - 'migrations/001_financial_core.sql'
      - 'tests/test-postgres-financial-core.js'
      - 'tests/test-financial-money.js'
      - '.github/workflows/postgres-financial-core.yml'
  push:
    branches: [main]
    paths:
      - 'financial/**'
      - 'migrations/001_financial_core.sql'
      - 'tests/test-postgres-financial-core.js'
      - 'tests/test-financial-money.js'

jobs:
  postgres-transaction-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disha_test
          POSTGRES_PASSWORD: test_only_not_production
          POSTGRES_DB: disha_financial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disha_test -d disha_financial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://disha_test:test_only_not_production@127.0.0.1:5432/disha_financial_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Verify exact paise math
        run: node tests/test-financial-money.js
      - name: Prove PostgreSQL transaction invariants
        run: node tests/test-postgres-financial-core.js
