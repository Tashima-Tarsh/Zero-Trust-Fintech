name: Forensic UPI Engine CI
on:
  push:
    paths:
      - "forensic-upi-engine/**"
      - ".github/workflows/forensic-upi-ci.yml"
  pull_request:
    paths:
      - "forensic-upi-engine/**"
      - ".github/workflows/forensic-upi-ci.yml"
jobs:
  unit-and-structure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forensic-upi-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Unit tests
        run: python -m pytest backend/tests -q
      - name: Validate scaffold and n8n JSON
        run: python scripts/validate_structure.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate web JavaScript
        run: node --check web-fallback/script.js
