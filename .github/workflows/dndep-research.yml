name: D-NDEP platform evidence fabric research tests
on:
  push:
    branches:
      - 'research/dndep-platform-evidence-fabric'
  pull_request:
    branches:
      - main
    paths:
      - 'experimental/dndep/**'
      - 'tests/test-dndep-protocol.js'
      - '.github/workflows/dndep-research.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check experimental/dndep/protocol.js && node --check tests/test-dndep-protocol.js && node --check experimental/dndep/gateway.js && node --check tests/test-dndep-gateway.js
      - name: Adversarial D-NDEP protocol regression
        run: node tests/test-dndep-protocol.js && node tests/test-dndep-gateway.js
