name: Production CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'zero-trust-fintech-production/**'
      - 'sharepay-mvp/**'
      - 'merchant-pwa/**'
      - '.github/workflows/production-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zero-trust-fintech-production/**'
      - 'sharepay-mvp/**'
      - 'merchant-pwa/**'

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15-alpine'
  REDIS_VERSION: '7-alpine'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'zero-trust-fintech-production/requirements.txt'
      
      - name: Install Linting Tools
        run: |
          cd zero-trust-fintech-production
          python -m pip install --upgrade pip
          pip install flake8 black isort -r requirements.txt
      
      - name: Run Flake8 (Linting)
        run: |
          cd zero-trust-fintech-production
          flake8 app/ --max-line-length=140 --ignore=E203,W503,E402,F401,F841
      
      - name: Run Black Check
        run: |
          cd zero-trust-fintech-production
          black --check app/

  test:
    name: Automated Tests & Migrations
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zerotrust
          POSTGRES_PASSWORD: SecurePass123!
          POSTGRES_DB: zerotrust_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'zero-trust-fintech-production/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd zero-trust-fintech-production
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      
      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://zerotrust:SecurePass123!@localhost:5432/zerotrust_ledger
          PYTHONPATH: ${{ github.workspace }}/zero-trust-fintech-production
        run: |
          cd zero-trust-fintech-production
          alembic upgrade head
      
      - name: Run Backend Automated Tests (31 Tests)
        env:
          DATABASE_URL: postgresql://zerotrust:SecurePass123!@localhost:5432/zerotrust_ledger
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-minimum-32-chars
          N8N_WEBHOOK_URL: http://localhost:5678/webhook
          N8N_API_KEY: test-n8n-key
          APP_ENV: test
          PYTHONPATH: ${{ github.workspace }}/zero-trust-fintech-production
        run: |
          cd zero-trust-fintech-production
          python tests/test_audit_fixes.py
          python tests/test_fraud_engine.py
          python tests/test_p0_p1_p2.py
          pytest tests/ -v
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run SharePay Customer & Merchant Test Suites (15 Tests)
        run: |
          npm test --prefix sharepay-mvp
          node merchant-pwa/test.js

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run Bandit Security Analysis
        run: |
          pip install bandit
          bandit -r zero-trust-fintech-production/app -ll

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Container Image
        run: |
          cd zero-trust-fintech-production
          docker build -t zerotrust-fintech:${{ github.sha }} .
