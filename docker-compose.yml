version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sharepay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zerotrust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePass123!}
      POSTGRES_DB: ${DB_NAME:-zerotrust_ledger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zerotrust} -d ${DB_NAME:-zerotrust_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharepay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./zero-trust-fintech-production
      dockerfile: Dockerfile
    container_name: sharepay_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-zerotrust}:${DB_PASSWORD:-SecurePass123!}@postgres:5432/${DB_NAME:-zerotrust_ledger}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-zerotrust-fintech-jwt-secret-key-32bytes-minimum!}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/webhook}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sharepay-pwa:
    image: node:22-alpine
    container_name: sharepay_customer_pwa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sharepay-mvp:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && node server.js"
    environment:
      PORT: 3000
      MERCHANT_UPI_ID: ${MERCHANT_UPI_ID:-yourmerchant@ybl}
      MERCHANT_NAME: ${MERCHANT_NAME:-SharePay Store}
    depends_on:
      - backend

  merchant-pwa:
    image: node:22-alpine
    container_name: sharepay_merchant_pwa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./merchant-pwa:/app
    ports:
      - "8080:8080"
    command: sh -c "node server.js"
    environment:
      PORT: 8080
    depends_on:
      - sharepay-pwa

volumes:
  postgres_data:
  redis_data:
