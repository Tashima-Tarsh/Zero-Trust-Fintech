<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merchant Portal — DISHA 8.2</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #06080d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }
    /* Animated Gradient Surface */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.22), transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.18), transparent 50%),
        radial-gradient(circle at 15% 80%, rgba(6, 182, 212, 0.15), transparent 50%),
        #06080d;
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 12s ease-in-out infinite alternate;
    }
    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      z-index: 1;
    }
    @keyframes ambientPulse {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    .auth-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    .brand-logo {
      width: 175px;
      height: 42px;
      object-fit: contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 16px rgba(16, 185, 129, 0.25));
    }
    #sign-in {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    .loading-pulse {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(16, 185, 129, 0.18);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Math Canvas */
    #math-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0.35;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-lines"></div>
  <canvas id="math-canvas"></canvas>

  <main class="auth-container">
    <a href="/"><img class="brand-logo" src="/assets/disha-8-2-wordmark-cropped.png" alt="DISHA 8.2"></a>
    <div id="sign-in">
      <div class="loading-pulse" id="authSpinner"></div>
    </div>
  </main>

  <!-- Floating Mathematical Equations Background -->
  <script>
    (function () {
      const canvas = document.getElementById('math-canvas');
      const ctx = canvas.getContext('2d');

      // Financial / cryptographic math equations for DISHA context
      const EQUATIONS = [
        'P(fraud) → 0',
        'ΔT = T_settle − T_pay = 0',
        'MDR = 0%',
        'ΣFee = ₹0',
        'H(UTR) = SHA-256',
        'VPA · sig ≡ NPCI',
        'ε < 10⁻⁹',
        'Σ_savings = R × (MDR_avg − 0)',
        'T+0 ∀ txn',
        '∫ revenue dt ↑',
        'Anti-Replay: nonce ∪ timestamp',
        'f(x) = Revenue × 0.98',
        'λ_fraud = 0',
        'PAN ⊕ VPA → bank',
        '∂P/∂fee = −1',
        'UPI ≡ Direct IMPS',
        'HMAC-SHA512(payload)',
        'AES-256-GCM(data)',
        'μ_latency < 800ms',
        'Net = Gross − 0',
        'ROI = ∞ (zero fee)',
        'Cryptographic nonce N',
        'P(intercept) ≈ 0',
        'Σ MDR saved / month',
        'BIC · IFSC → vault',
        'sign(txn) → verified',
        '∀ merchant: fee = 0',
        'replay_window = 30s',
        'idempotency_key = uuid4()',
        'k = ₹1Cr × 1% = ₹1L/mo',
      ];

      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function spawn() {
        return {
          x: Math.random() * canvas.width,
          y: canvas.height + 20,
          text: EQUATIONS[Math.floor(Math.random() * EQUATIONS.length)],
          speed: 0.3 + Math.random() * 0.5,
          opacity: 0,
          maxOpacity: 0.5 + Math.random() * 0.5,
          size: 11 + Math.floor(Math.random() * 7),
          drift: (Math.random() - 0.5) * 0.25,
          fade: 'in',
          life: 0,
          maxLife: 220 + Math.random() * 180,
          color: Math.random() > 0.6
            ? `rgba(16,185,129,1)`   // emerald
            : Math.random() > 0.5
              ? `rgba(99,102,241,1)` // indigo
              : `rgba(6,182,212,1)`  // cyan
        };
      }

      function init() {
        resize();
        for (let i = 0; i < 18; i++) {
          const p = spawn();
          p.y = Math.random() * canvas.height;
          p.life = Math.random() * p.maxLife;
          p.opacity = p.maxOpacity * 0.6;
          particles.push(p);
        }
      }

      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Spawn new particles
        if (particles.length < 28 && Math.random() < 0.04) {
          particles.push(spawn());
        }

        particles = particles.filter(p => {
          p.life++;
          p.y -= p.speed;
          p.x += p.drift;

          // Fade in / hold / fade out
          if (p.life < 40) {
            p.opacity = (p.life / 40) * p.maxOpacity;
          } else if (p.life > p.maxLife - 40) {
            p.opacity = ((p.maxLife - p.life) / 40) * p.maxOpacity;
          } else {
            p.opacity = p.maxOpacity;
          }

          if (p.opacity <= 0 || p.y < -30) return false;

          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.font = `${p.size}px "JetBrains Mono", "Courier New", monospace`;
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          ctx.restore();
          return true;
        });

        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resize);
      init();
      tick();
    })();
  </script>

  <script src="/auth-config.js"></script>
  <script>
    window.addEventListener('load', async () => {
      const key = window.DISHA_CLERK_PUBLISHABLE_KEY;
      if (!key) return;
      const domain = atob(key.split('_')[2]).slice(0, -1);
      try {
        await new Promise((ok, no) => {
          const s = document.createElement('script');
          s.src = `https://${domain}/npm/@clerk/ui@1/dist/ui.browser.js`;
          s.crossOrigin = 'anonymous';
          s.onload = ok;
          s.onerror = no;
          document.head.appendChild(s);
        });
        await new Promise((ok, no) => {
          const s = document.createElement('script');
          s.src = `https://${domain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
          s.crossOrigin = 'anonymous';
          s.dataset.clerkPublishableKey = key;
          s.onload = ok;
          s.onerror = no;
          document.head.appendChild(s);
        });
        await Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
        if (Clerk.isSignedIn) {
          location.replace('/dashboard');
          return;
        }
        const spinner = document.getElementById('authSpinner');
        if (spinner) spinner.remove();
        Clerk.mountSignIn(document.getElementById('sign-in'), {
          afterSignInUrl: '/dashboard'
        });
      } catch (e) {
        console.error('Clerk initialization failed', e);
      }
    });
  </script>
</body>
</html>
