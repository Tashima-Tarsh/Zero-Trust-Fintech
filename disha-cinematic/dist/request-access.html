<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d13"><title>Request Merchant Access | DISHA 8.2</title><meta name="description" content="Request access to DISHA 8.2 merchant-owned payment intelligence. Private approval and onboarding."><link rel="icon" type="image/png" href="/assets/disha-8-2-wordmark-cropped.png"><link rel="stylesheet" href="/platform-console.css?v=1"></head>
<body class="platform-body"><main style="min-height:100svh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 72% 20%,#6d392f49,transparent 38%),#0b0d13"><section style="width:min(100%,540px);background:#181821;border:1px solid #ed95604a;border-radius:22px;padding:clamp(22px,5vw,44px);box-shadow:0 30px 100px #0008">
<a href="/"><img src="/assets/disha-8-2-wordmark-cropped.png" alt="DISHA 8.2" style="width:190px;height:56px;object-fit:contain;object-position:left"></a>
<p class="section-kicker" style="margin-top:26px">BY INVITATION / MERCHANT ACCESS</p><h1 style="font-size:clamp(31px,5vw,44px);margin:10px 0 14px">Your business deserves its own payment intelligence.</h1><p style="color:#bfb5b8;font-size:14px;line-height:1.65;margin-bottom:26px">Tell us a little about your business. Our platform owner reviews every request personally. An application does not create a merchant account.</p>
<form id="access-form" style="display:grid;gap:14px">
<label>Business name *<input name="businessName" maxlength="160" required minlength="3" autocomplete="organization" placeholder="Registered or trading name"></label>
<label>Contact person *<input name="contactName" maxlength="160" required minlength="2" autocomplete="name" placeholder="Your full name"></label>
<label>Business email *<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="name@business.com"></label>
<label>Phone number <input name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="+91…"></label>
<label>Business category <input name="category" maxlength="100" placeholder="Retail, SaaS, services…"></label>
<label>Estimated monthly UPI volume <select name="estimatedVolume"><option value="">Prefer not to say</option><option value="Below INR 10 lakh">Below ₹10 lakh</option><option value="INR 10–50 lakh">₹10–50 lakh</option><option value="INR 50 lakh–5 crore">₹50 lakh–5 crore</option><option value="Above INR 5 crore">Above ₹5 crore</option></select></label>
<button type="submit" class="action-btn" style="padding:13px 17px;margin-top:8px">Submit access request ↗</button>
<p id="request-status" role="status" aria-live="polite" style="font-size:13px;color:#f6b594"></p>
</form><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid #ffffff25;font-size:12px;color:#b6aeb6"><a href="/login">Already approved? Merchant Login</a><a href="/">Return to DISHA 8.2</a></div></section></main>
<style>form label{font-size:12px;color:#d9ced0;display:grid;gap:6px}form input,form select{width:100%;background:#0e1017;color:#eee;border:1px solid #ffffff32;border-radius:9px;padding:12px 13px;font-size:14px;min-height:44px}form input:focus,form select:focus{outline:2px solid #ed9560;outline-offset:1px}form button:disabled{opacity:.55;cursor:progress}</style>
<script>document.getElementById('access-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),output=document.getElementById('request-status');button.disabled=true;output.textContent='Submitting your application…';try{const data=Object.fromEntries(new FormData(form));const res=await fetch('/api/platform/public/request-access',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const result=await res.json();if(!res.ok)throw Error(result.error||'Request could not be submitted');output.textContent='Request received. Reference: '+result.reference+'. We will review your application.';form.reset()}catch(error){output.textContent=error.message}finally{button.disabled=false}})</script>
</body></html>
