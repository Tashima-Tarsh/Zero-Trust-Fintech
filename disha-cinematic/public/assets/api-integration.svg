<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <rect width="600" height="300" fill="#FFFFFF"/>
  <!-- API endpoint blocks -->
  <rect x="60" y="60" width="220" height="120" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="320" y="60" width="220" height="120" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="200" width="480" height="40" rx="8" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
  <!-- Request arrow -->
  <path d="M280 110 L320 120" stroke="#24215A" stroke-width="2.5" stroke-linecap="round">
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24215A"/>
    </marker>
  </path>
  <!-- Labels -->
  <text x="170" y="96" font-family="Manrope" font-size="13" font-weight="700" fill="#24215A">Customer Platform</text>
  <text x="170" y="116" font-family="DM Sans" font-size="11" fill="#6B7280">POST /api/merchant/payments</text>
  <text x="170" y="136" font-family="DM Sans" font-size="11" fill="#6B7280">Bearer token · Challenge paise</text>
  <text x="430" y="96" font-family="Manrope" font-size="13" font-weight="700" fill="#24215A">DISHA API</text>
  <text x="430" y="116" font-family="DM Sans" font-size="11" fill="#6B7280">7-layer verification · Ledger</text>
  <text x="430" y="136" font-family="DM Sans" font-size="11" fill="#6B7280">JSON · HTTPS · IP-whitelisted</text>
  <text x="300" y="224" font-family="DM Sans" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">→ Instant WebSocket confirmation → Balanced double-entry ledger</text>
</svg>
