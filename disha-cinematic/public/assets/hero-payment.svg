<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24215A"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#grad1)"/>
  <!-- Abstract merchant counter -->
  <path d="M60 300 H740 V120 H60 Z" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Phone (customer) -->
  <rect x="140" y="160" width="92" height="140" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="160" y="184" width="52" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="160" y="200" width="20" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="175" y="230" width="22" height="22" rx="6" fill="#10B981"/>
  <rect x="175" y="230" width="22" height="4" rx="2" fill="#059669"/>
  <!-- Phone (merchant) -->
  <rect x="568" y="160" width="92" height="140" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="588" y="184" width="52" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="588" y="200" width="20" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="588" y="230" width="22" height="22" rx="6" fill="#10B981"/>
  <rect x="588" y="230" width="22" height="4" rx="2" fill="#059669"/>
  <!-- Connection beam -->
  <path d="M232 240 L568 240" stroke="#24215A" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <path d="M232 240 L568 240" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,200;100,200;200,200" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Amount badge -->
  <rect x="330" y="270" width="140" height="44" rx="12" fill="#24215A"/>
  <text x="400" y="296" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹1,249.37</text>
  <text x="400" y="312" font-family="DM Sans, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Direct UPI · Zero Commission</text>
  <!-- Decorative dots -->
  <circle cx="620" cy="90" r="20" fill="#10B981" opacity="0.1"/>
  <circle cx="720" cy="150" r="28" fill="#4F46E5" opacity="0.1"/>
  <circle cx="100" cy="340" r="24" fill="#10B981" opacity="0.08"/>
</svg>
