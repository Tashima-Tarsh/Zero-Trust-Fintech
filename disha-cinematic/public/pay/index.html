  <!-- Background Mathematical Equations Animation -->
  <script>
    (function () {
      const canvas = document.getElementById('math-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const EQ = [
        'P(fraud) → 0', 'MDR = 0%', 'ΔT = 0', 'H(UTR) = SHA-256',
        'VPA · sig ≡ NPCI', 'ΣFee = ₹0', 'T+0 IMPS', 'Anti-Replay',
        'PAN ⊕ VPA', 'idempotency_key', 'E(X) = 0.00', 'Kerckhoffs ≡ Valid'
      ];
      let p = [];
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      function spawn() {
        return {
          x: Math.random() * canvas.width,
          y: canvas.height + 20,
          text: EQ[Math.floor(Math.random() * EQ.length)],
          speed: 0.25 + Math.random() * 0.4,
          opacity: 0,
          maxOpacity: 0.35,
          life: 0,
          maxLife: 260,
          color: Math.random() > 0.5 ? '#059669' : '#2563eb'
        };
      }
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (p.length < 20 && Math.random() < 0.06) p.push(spawn());
        p = p.filter(item => {
          item.life++;
          item.y -= item.speed;
          if (item.life < 30) item.opacity = (item.life / 30) * item.maxOpacity;
          else if (item.life > item.maxLife - 30) item.opacity = ((item.maxLife - item.life) / 30) * item.maxOpacity;
          if (item.opacity <= 0 || item.y < -20) return false;
          ctx.save();
          ctx.globalAlpha = item.opacity;
          ctx.font = '12px "JetBrains Mono", monospace';
          ctx.fillStyle = item.color;
          ctx.fillText(item.text, item.x, item.y);
          ctx.restore();
          return true;
        });
        requestAnimationFrame(loop);
      }
      window.addEventListener('resize', resize);
      resize();
      loop();
    })();
  </script>

  <!-- Checkout Logic: Dynamic QR, UPI Intents, Clipboard SST, Verification, WebSockets -->
  <script>
    const challengeAmountEl = document.getElementById('challengeAmountEl');
    const qrLoading = document.getElementById('qrLoading');
    const qrImg = document.getElementById('qrImg');
    const vpaPill = document.getElementById('vpaPill');
    const vpaAddress = document.getElementById('vpaAddress');

    const linkGPay = document.getElementById('linkGPay');
    const linkPhonePe = document.getElementById('linkPhonePe');
    const linkPaytm = document.getElementById('linkPaytm');
    const linkCred = document.getElementById('linkCred');

    const utrInput = document.getElementById('utrInput');
    const btnAutoClip = document.getElementById('btnAutoClip');
    const autoClipText = document.getElementById('autoClipText');
    const btnVerify = document.getElementById('btnVerify');
    const btnVerifyText = document.getElementById('btnVerifyText');
    const btnVerifySpinner = document.getElementById('btnVerifySpinner');

    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const btnRetrySession = document.getElementById('btnRetrySession');

    let currentSession = null;
    let ws = null;

    function formatINR(val) {
      return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showStatus(type, title, desc, showRetry = false) {
      statusCard.className = 'w-full mt-3 p-3.5 rounded-xl text-left block text-xs ';
      if (type === 'success') {
        statusCard.className += 'bg-emerald-50 border border-emerald-200 text-emerald-900';
      } else if (type === 'error') {
        statusCard.className += 'bg-rose-50 border border-rose-200 text-rose-900';
      } else {
        statusCard.className += 'bg-blue-50 border border-blue-200 text-blue-900';
      }
      statusTitle.textContent = title;
      statusDesc.textContent = desc || '';
      btnRetrySession.style.display = showRetry ? 'inline-block' : 'none';
      statusCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setVerifying(isLoading) {
      btnVerify.disabled = isLoading;
      btnVerifySpinner.classList.toggle('hidden', !isLoading);
      btnVerifyText.textContent = isLoading ? 'Verifying with Bank...' : 'Verify Payment';
    }

    // 1. Initialize Checkout Session
    async function initSession() {
      try {
        qrLoading.classList.remove('hidden');
        qrImg.classList.add('hidden');
        statusCard.classList.add('hidden');

        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || 500;
        const res = await fetch(`/api/session/new?amount=${encodeURIComponent(amount)}&description=Checkout+Order`);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || 'Session creation failed: HTTP ' + res.status);
        }
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.message || data.error || 'Failed to initialize session');
        }

        currentSession = data;
        challengeAmountEl.textContent = formatINR(data.challengeAmount);
        vpaAddress.textContent = data.vpaAddress;

        // Render QR
        if (data.qrDataUrl) {
          qrImg.src = data.qrDataUrl;
          qrImg.classList.remove('hidden');
          qrLoading.classList.add('hidden');
        }

        // Set UPI deep links
        if (data.upiLink) {
          linkGPay.href = data.appLinks?.android?.gpay || data.upiLink;
          linkPhonePe.href = data.appLinks?.android?.phonepe || data.upiLink;
          linkPaytm.href = data.appLinks?.android?.paytm || data.upiLink;
          linkCred.href = data.upiLink;
        }

        // Setup real-time WebSocket listener
        setupWebSocket(data.orderId);

        // Try reading clipboard automatically on startup (SST flow)
        tryAutoReadClipboard(false);
      } catch (err) {
        console.error('Session error:', err);
        showStatus('error', 'Session Failed', err.message || 'Unable to connect to payment switch.', true);
      }
    }

    // 2. Real-time WebSocket settlement notification
    function setupWebSocket(orderId) {
      try {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/checkout?orderId=${encodeURIComponent(orderId)}`);
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'SETTLED' || msg.type === 'PAYMENT_VERIFIED') {
              onPaymentSuccess(msg.utr || 'DIRECT_SETTLED', msg.amount || currentSession.challengeAmount);
            }
          } catch (e) {}
        };
      } catch (e) {
        console.log('WS not connected; client manual UTR verification active');
      }
    }

    function onPaymentSuccess(utr, amount) {
      showStatus('success', '✅ Payment Settled (T+0)', `Transaction verified. UTR: ${utr}. Settled directly to merchant bank account at 0% fee.`);
      btnVerify.style.display = 'none';
      btnAutoClip.style.display = 'none';
      utrInput.disabled = true;
    }

    // 3. Verify UTR
    async function verifyPayment() {
      const utr = utrInput.value.trim();
      if (!utr) {
        showStatus('error', 'UTR Required', 'Please enter or paste the 12-digit UTR from your UPI payment confirmation.');
        utrInput.focus();
        return;
      }
      if (!/^\d{12}$/.test(utr)) {
        showStatus('error', 'Invalid UTR Format', 'The UTR must be exactly 12 numeric digits.');
        utrInput.focus();
        return;
      }
      if (!currentSession) {
        showStatus('error', 'No Active Session', 'Please refresh the page to start a new checkout session.');
        return;
      }

      setVerifying(true);
      showStatus('processing', 'Verifying with NPCI Rail...', 'Validating UTR uniqueness, amount match, and bank settlement invariant.');

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            utr: utr,
            amount: currentSession.challengeAmount,
            orderId: currentSession.orderId
          })
        });
        const data = await res.json();
        if (res.status === 200 && data.success && data.verified === true && data.state === 'VERIFIED') {
          onPaymentSuccess(utr, currentSession.challengeAmount);
        } else if (res.status === 202 && data.state === 'UTR_OBSERVED') {
          showStatus('processing', 'UPI Reference Recorded', 'UTR matched to the order but bank credit is not independently confirmed; payment remains pending.');
        } else {
          showStatus('error', 'Reference Not Accepted', data.reason || data.error || 'Unable to match the UPI reference to this order.');
        }
      } catch (err) {
        showStatus('error', 'Network Error', err.message || 'Unable to contact verification service.');
      } finally {
        setVerifying(false);
      }
    }

    // 4. Smart System Target (SST) & Clipboard Auto-Detection
    async function tryAutoReadClipboard(userTriggered = false) {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        if (userTriggered) {
          showStatus('processing', 'Clipboard Not Available', 'Please type the 12-digit UTR manually.');
        }
        return;
      }
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return;
        const match = text.match(/\b(\d{12})\b/);
        if (match) {
          const detected = match[1];
          if (utrInput.value !== detected) {
            utrInput.value = detected;
            autoClipText.textContent = `✅ UTR Auto-Detected: ${detected}`;
            showStatus('processing', 'UTR Detected from Clipboard', `Auto-filled UTR: ${detected}. Click "Verify Payment" to confirm.`);
          }
        } else if (userTriggered) {
          const digits = text.replace(/\D/g, '');
          if (digits.length >= 12) {
            utrInput.value = digits.slice(0, 12);
            showStatus('processing', 'UTR Extracted', `Extracted 12 digits: ${utrInput.value}. Click Verify to complete.`);
          } else {
            showStatus('processing', 'No 12-Digit UTR Found', 'No 12-digit UTR found on clipboard. Please enter it manually.');
          }
        }
      } catch (e) {
        // Silent fail if permission not granted on background event
        if (userTriggered) {
          utrInput.focus();
        }
      }
    }

    // Event Listeners
    btnAutoClip.addEventListener('click', () => tryAutoReadClipboard(true));
    btnVerify.addEventListener('click', verifyPayment);
    btnRetrySession.addEventListener('click', initSession);

    // Auto-detect UTR on window focus or visibility change (returning from UPI app)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        tryAutoReadClipboard(false);
      }
    });
    window.addEventListener('focus', () => {
      tryAutoReadClipboard(false);
    });

    // Payee VPA copy
    vpaPill.addEventListener('click', () => {
      if (currentSession && currentSession.vpaAddress) {
        navigator.clipboard.writeText(currentSession.vpaAddress).then(() => {
          const orig = vpaAddress.textContent;
          vpaAddress.textContent = 'Copied to Clipboard!';
          setTimeout(() => vpaAddress.textContent = orig, 1200);
        });
      }
    });

    // Sanitization on input
    utrInput.addEventListener('input', () => {
      utrInput.value = utrInput.value.replace(/\D/g, '').slice(0, 12);
    });
    utrInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        verifyPayment();
      }
    });

    // Start
    initSession();
  </script>
