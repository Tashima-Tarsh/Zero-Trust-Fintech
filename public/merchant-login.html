<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — DISHA 8.2</title><link rel="icon" type="image/png" href="/assets/disha-8-2-wordmark.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7faf8;font-family:Inter,system-ui,sans-serif;color:#10201d}.box{width:min(100% - 32px,440px);text-align:center}.logo{width:190px;height:74px;object-fit:contain;margin:0 auto 16px}p{color:#5c6d68}#sign-in{margin-top:24px;text-align:left}.panel{background:#fff;border:1px solid #dce7e2;border-radius:16px;padding:22px;text-align:center}.button{display:block;width:100%;border:0;background:#08735d;color:white;text-decoration:none;padding:13px;border-radius:10px;font:750 15px Inter,system-ui,sans-serif;margin:12px 0;cursor:pointer}.request{color:#08735d;font-weight:700;font-size:14px}.note{font-size:13px;color:#5c6d68;line-height:1.5}.error{background:#fff;border:1px solid #dce7e2;border-radius:16px;padding:24px;color:#5c6d68;text-align:left}</style></head><body><main class="box"><a href="/"><img class="logo" src="/assets/disha-8-2-wordmark.png" alt="DISHA 8.2"></a><h1>Merchant workspace</h1><p>Sign in to manage your payment operations.</p><div id="sign-in"><div class="panel" id="signin-fallback"><button class="button" id="signin-link" type="button">Sign in securely</button><a class="request" href="mailto:hello@mail.thenitishkr.in?subject=DISHA%20merchant%20access%20request">Request merchant access</a><p class="note">New merchant accounts are created by invitation. Google sign-in can be enabled after your Google identity provider is connected in Clerk.</p></div></div></main><script src="/auth-config.js"></script><script>window.addEventListener('load',async()=>{const key=window.DISHA_CLERK_PUBLISHABLE_KEY,button=document.querySelector('#signin-link');if(!key){button.textContent='Sign-in is being activated';button.disabled=true;return}button.onclick=()=>{if(window.Clerk)Clerk.openSignIn({afterSignInUrl:'/dashboard'});else button.textContent='Loading secure sign-in…'};const domain=atob(key.split('_')[2]).slice(0,-1);try{for(const src of [`https://${domain}/npm/@clerk/ui@1/dist/ui.browser.js`,`https://${domain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`]){await new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});if(Clerk.isSignedIn){location.replace('/dashboard');return}Clerk.mountSignIn(document.getElementById('sign-in'),{afterSignInUrl:'/dashboard'});}catch(e){button.textContent='Secure sign-in unavailable — request access';console.warn('Clerk sign-in unavailable',e)}});</script></body></html>
