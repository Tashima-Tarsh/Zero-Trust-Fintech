<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merchant Portal — DISHA 8.2</title>
  <link rel="icon" type="image/png" href="/assets/disha-8-2-wordmark.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #06080d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }
    /* Animated Gradient Surface */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.22), transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.18), transparent 50%),
        radial-gradient(circle at 15% 80%, rgba(6, 182, 212, 0.15), transparent 50%),
        #06080d;
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 12s ease-in-out infinite alternate;
    }
    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      z-index: 1;
    }
    @keyframes ambientPulse {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    .auth-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    .brand-logo {
      width: 175px;
      height: 42px;
      object-fit: contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 16px rgba(16, 185, 129, 0.25));
    }
    #sign-in {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    .loading-pulse {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(16, 185, 129, 0.18);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-lines"></div>

  <main class="auth-container">
    <a href="/"><img class="brand-logo" src="/assets/disha-8-2-wordmark.png" alt="DISHA 8.2"></a>
    <div id="sign-in">
      <div class="loading-pulse" id="authSpinner"></div>
    </div>
  </main>

  <script src="/auth-config.js"></script>
  <script>
    window.addEventListener('load', async () => {
      const key = window.DISHA_CLERK_PUBLISHABLE_KEY;
      if (!key) return;
      const domain = atob(key.split('_')[2]).slice(0, -1);
      try {
        await new Promise((ok, no) => {
          const s = document.createElement('script');
          s.src = `https://${domain}/npm/@clerk/ui@1/dist/ui.browser.js`;
          s.crossOrigin = 'anonymous';
          s.onload = ok;
          s.onerror = no;
          document.head.appendChild(s);
        });
        await new Promise((ok, no) => {
          const s = document.createElement('script');
          s.src = `https://${domain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
          s.crossOrigin = 'anonymous';
          s.dataset.clerkPublishableKey = key;
          s.onload = ok;
          s.onerror = no;
          document.head.appendChild(s);
        });
        await Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
        if (Clerk.isSignedIn) {
          location.replace('/dashboard');
          return;
        }
        const spinner = document.getElementById('authSpinner');
        if (spinner) spinner.remove();
        Clerk.mountSignIn(document.getElementById('sign-in'), {
          afterSignInUrl: '/dashboard'
        });
      } catch (e) {
        console.error('Clerk initialization failed', e);
      }
    });
  </script>
</body>
</html>
