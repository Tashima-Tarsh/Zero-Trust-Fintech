<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISHA Android Debit Bridge | Synthetic Transport Lab</title>
<style>
body{font:16px system-ui;background:#11121b;color:#eee;max-width:650px;margin:32px auto;padding:20px}
section{border:1px solid #5b5e73;border-radius:12px;padding:20px}
button{padding:12px;border-radius:7px;cursor:pointer;margin:8px 8px 8px 0}
label{display:block;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#212436;padding:12px}
strong{color:#ffbd7e}
</style></head>
<body>
<h1>DISHA Debit Bridge — Lab</h1>
<p><strong>SYNTHETIC ONLY. This page does not make a payment and cannot verify bank debit.</strong></p>
<section>
<label><input id="consent" type="checkbox"> I consent to this synthetic device-channel experiment</label>
<button id="synthetic">Test protocol using synthetic adapter</button>
<button id="native">Test Chrome → Android handler (if eligible)</button>
<button id="cancel">Revoke / reset</button>
<p>Order <code>DISHA_LAB_001</code>, amount ₹1.05, payee <code>fixture@invalid</code> (synthetic fixture)</p>
<pre id="result" role="status">READY — no payment attempted</pre>
</section>
<script src="./disha-debit-bridge.js"></script>
<script src="./disha-paymentrequest-transport.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id), show=o=>{$('result').textContent=JSON.stringify(o,null,2)};
 const bridge=window.DISHADebitBridgeLab;
 let inFlight=false,revision=0;
 function fixture(){
  if(!window.crypto?.getRandomValues)throw Error('SECURE_CONTEXT_REQUIRED');
  const a=new Uint8Array(16);window.crypto.getRandomValues(a);
  return {
   orderId:'DISHA_LAB_001',amountPaise:'105',payeeVpa:'fixture@invalid',
   nonce:Array.from(a,b=>b.toString(16).padStart(2,'0')).join(''),
   expiresAt:Date.now()+90000,consent:$('consent').checked,userGestureConfirmed:true
  };
 }
 function run(adapter){
  if(inFlight)return;
  inFlight=true;
  const generation=revision; // revocation invalidates pending UI results
  try {
   const request=bridge.create({transport:adapter});
   request.requestDebitEvidence(fixture()).then(result=>{
    if(generation===revision&&$('consent').checked)show(result);
   }).catch(e=>{
    if(generation===active)show({state:e.message,debitVerified:false});
   }).finally(()=>{inFlight=false});
  }catch(e){inFlight=false;show({state:e.message,debitVerified:false})}
 }
 $('synthetic').addEventListener('click',()=>run(bridge.syntheticTransport()));
 $('native').addEventListener('click',()=>{
  if(typeof PaymentRequest!=='function')return show({state:'PAYMENT_REQUEST_UNAVAILABLE'});
  run(window.DISHADebitPaymentRequestTransport.make({PaymentRequestClass:PaymentRequest,requireGesture:()=>true}));
 });
 $('cancel').addEventListener('click',()=>{
  revision++;$('consent').checked=false;
  show({state:'CONSENT_REVOKED',debitVerified:false});
 });
})();
</script></body></html>
