<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DISHA 8.2 — Sovereign UPI Checkout</title>
  <meta name="description" content="Zero-Fee, Fraud-Proof UPI Checkout. Pay directly to merchant bank account with mathematical zero-trust verification.">
  <meta name="theme-color" content="#094cb2">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon.svg">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      color: #0f172a;
      background: #f8fafc;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      padding: 16px;
    }

    /* Math Background Particle Canvas */
    #math-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }

    .checkout-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12), 0 0 1px 1px rgba(15, 23, 42, 0.04);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Header */
    .card-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      background: #ffffff;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: #094cb2;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Noto Serif', serif;
      font-size: 18px;
      font-weight: 700;
    }
    .brand-info {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.72rem;
      color: #059669;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .support-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #047857;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .support-badge:hover {
      background: #d1fae5;
    }

    /* Amount Section */
    .amount-hero {
      padding: 24px 24px 20px;
      text-align: center;
      background: linear-gradient(180deg, #fafafa 0%, #f8fafc 100%);
      border-bottom: 1px solid #f1f5f9;
    }
    .amount-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 4px;
    }
    .amount-value {
      font-family: 'Inter', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    .amount-paise-note {
      font-size: 0.75rem;
      color: #059669;
      font-weight: 600;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* QR Code Section */
    .qr-section {
      padding: 24px;
      text-align: center;
    }
    .qr-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 16px;
      padding: 10px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      border-radius: 8px;
    }
    .qr-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #64748b;
      font-size: 0.8rem;
      height: 100%;
    }

    .vpa-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #334155;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: all;
      transition: all 0.2s;
    }
    .vpa-pill:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    /* UPI Apps Mobile Grid */
    .upi-apps-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .upi-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      text-decoration: none;
      color: #1e293b;
      font-size: 0.72rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .upi-btn:hover {
      background: #f1f5f9;
      border-color: #094cb2;
      color: #094cb2;
    }
    .upi-icon {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    /* UTR Verification Section */
    .verify-section {
      padding: 0 24px 24px;
    }
    .section-divider {
      position: relative;
      text-align: center;
      margin: 16px 0 20px;
    }
    .section-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e2e8f0;
      z-index: 0;
    }
    .section-divider span {
      position: relative;
      z-index: 1;
      background: #ffffff;
      padding: 0 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .utr-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .utr-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .utr-input {
      width: 100%;
      height: 48px;
      padding: 0 110px 0 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
    }
    .utr-input:focus {
      background: #ffffff;
      border-color: #094cb2;
      box-shadow: 0 0 0 3px rgba(9, 76, 178, 0.12);
    }
    .btn-paste {
      position: absolute;
      right: 6px;
      height: 36px;
      padding: 0 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #094cb2;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-paste:hover {
      background: #dbeafe;
    }

    .btn-verify {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
      transition: all 0.2s ease;
    }
    .btn-verify:hover {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
    }
    .btn-verify:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status-card {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .status-card.success {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #14532d;
    }
    .status-card.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .status-card.processing {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
    }
    .status-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .status-desc {
      font-size: 0.78rem;
      line-height: 1.4;
      opacity: 0.9;
    }

    .card-footer {
      padding: 14px 24px;
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
    }
    .footer-secure {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- Background Mathematical Equations Animation -->
  <script>
    (function () {
      const canvas = document.getElementById('math-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const EQ = [
        'P(fraud) → 0', 'MDR = 0%', 'ΔT = 0', 'H(UTR) = SHA-256',
        'VPA · sig ≡ NPCI', 'ΣFee = ₹0', 'T+0 IMPS', 'Anti-Replay',
        'PAN ⊕ VPA', 'idempotency_key'
      ];
      let p = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      function spawn() {
        return {
          x: Math.random() * canvas.width,
          y: canvas.height + 15,
          text: EQ[Math.floor(Math.random() * EQ.length)],
          speed: 0.3 + Math.random() * 0.4,
          opacity: 0,
          maxOpacity: 0.4,
          life: 0,
          maxLife: 240,
          color: Math.random() > 0.5 ? '#059669' : '#094cb2'
        };
      }
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (p.length < 18 && Math.random() < 0.05) p.push(spawn());
        p = p.filter(item => {
          item.life++;
          item.y -= item.speed;
          if (item.life < 30) item.opacity = (item.life / 30) * item.maxOpacity;
          else if (item.life > item.maxLife - 30) item.opacity = ((item.maxLife - item.life) / 30) * item.maxOpacity;
          if (item.opacity <= 0 || item.y < -20) return false;
          ctx.save();
          ctx.globalAlpha = item.opacity;
          ctx.font = '12px "JetBrains Mono", monospace';
          ctx.fillStyle = item.color;
          ctx.fillText(item.text, item.x, item.y);
          ctx.restore();
          return true;
        });
        requestAnimationFrame(loop);
      }
      window.addEventListener('resize', resize);
      resize();
      loop();
    })();
  </script>

  <!-- Checkout Logic -->
  <script>
    const challengeAmountEl = document.getElementById('challengeAmountEl');
    const qrWrapper = document.getElementById('qrWrapper');
    const qrLoading = document.getElementById('qrLoading');
    const qrImg = document.getElementById('qrImg');
    const vpaPill = document.getElementById('vpaPill');
    const vpaAddress = document.getElementById('vpaAddress');

    const linkGPay = document.getElementById('linkGPay');
    const linkPhonePe = document.getElementById('linkPhonePe');
    const linkPaytm = document.getElementById('linkPaytm');
    const linkCred = document.getElementById('linkCred');

    const utrInput = document.getElementById('utrInput');
    const btnPaste = document.getElementById('btnPaste');
    const btnVerify = document.getElementById('btnVerify');
    const btnVerifyText = document.getElementById('btnVerifyText');
    const btnVerifySpinner = document.getElementById('btnVerifySpinner');

    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    let currentSession = null;
    let ws = null;

    function formatINR(val) {
      return '₹' + Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showStatus(type, title, desc) {
      statusCard.className = 'status-card ' + type;
      statusTitle.textContent = title;
      statusDesc.textContent = desc || '';
      statusCard.style.display = 'block';
    }

    function setVerifying(isLoading) {
      btnVerify.disabled = isLoading;
      btnVerifySpinner.style.display = isLoading ? 'inline-block' : 'none';
      btnVerifyText.textContent = isLoading ? 'Verifying with Bank...' : 'Verify Payment';
    }

    // 1. Create Session
    async function initSession() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || 500;
        const res = await fetch(`/api/session/new?amount=${encodeURIComponent(amount)}&description=Checkout+Order`);
        if (!res.ok) throw new Error('Session creation failed: HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to initialize session');

        currentSession = data;
        challengeAmountEl.textContent = formatINR(data.challengeAmount);
        vpaAddress.textContent = data.vpaAddress;

        // Display pre-generated QR data URL
        if (data.qrDataUrl) {
          qrImg.src = data.qrDataUrl;
          qrImg.style.display = 'block';
          qrLoading.style.display = 'none';
        }

        // Set UPI deep links
        if (data.upiLink) {
          linkGPay.href = data.upiLink;
          linkPhonePe.href = data.upiLink;
          linkPaytm.href = data.upiLink;
          linkCred.href = data.upiLink;
        }

        // Setup real-time WebSocket listener
        setupWebSocket(data.orderId);
      } catch (err) {
        console.error('Session error:', err);
        showStatus('error', 'Session Failed', err.message || 'Unable to connect to payment switch.');
      }
    }

    // 2. Real-time WebSocket settlement notification
    function setupWebSocket(orderId) {
      try {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/checkout?orderId=${encodeURIComponent(orderId)}`);
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'SETTLED' || msg.type === 'PAYMENT_VERIFIED') {
              onPaymentSuccess(msg.utr || 'DIRECT_SETTLED', msg.amount || currentSession.challengeAmount);
            }
          } catch (e) {}
        };
      } catch (e) {
        console.log('WS not connected; client manual UTR verification active');
      }
    }

    function onPaymentSuccess(utr, amount) {
      showStatus('success', '✅ Payment Settled (T+0)', `Transaction verified. UTR: ${utr}. Settled directly to merchant bank account at 0% fee.`);
      btnVerify.style.display = 'none';
      utrInput.disabled = true;
      btnPaste.disabled = true;
    }

    // 3. Verify UTR
    async function verifyPayment() {
      const utr = utrInput.value.trim();
      if (!utr) {
        showStatus('error', 'UTR Required', 'Please enter the 12-digit UTR from your UPI payment confirmation.');
        utrInput.focus();
        return;
      }
      if (!/^\d{12}$/.test(utr)) {
        showStatus('error', 'Invalid UTR Format', 'The UTR must be exactly 12 numeric digits.');
        utrInput.focus();
        return;
      }
      if (!currentSession) {
        showStatus('error', 'No Active Session', 'Please refresh the page to start a new checkout session.');
        return;
      }

      setVerifying(true);
      showStatus('processing', 'Verifying with NPCI Rail...', 'Validating UTR uniqueness, amount match, and bank settlement invariant.');

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            utr: utr,
            amount: currentSession.challengeAmount,
            orderId: currentSession.orderId
          })
        });
        const data = await res.json();
        if (res.status === 200 && data.success) {
          onPaymentSuccess(utr, currentSession.challengeAmount);
        } else {
          showStatus('error', 'Verification Failed', data.reason || data.error || 'UTR verification failed. Ensure payment was made for the exact challenge amount.');
        }
      } catch (err) {
        showStatus('error', 'Network Error', err.message || 'Unable to contact verification service.');
      } finally {
        setVerifying(false);
      }
    }

    // 4. Clipboard helper
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const match = text.match(/\b(\d{12})\b/);
        if (match) {
          utrInput.value = match[1];
          showStatus('processing', 'UTR Detected', `Pasted UTR: ${match[1]}. Click Verify to complete.`);
        } else {
          utrInput.value = text.replace(/\D/g, '').slice(0, 12);
        }
      } catch (e) {
        utrInput.focus();
      }
    }

    // Event Listeners
    btnPaste.addEventListener('click', pasteFromClipboard);
    btnVerify.addEventListener('click', verifyPayment);
    vpaPill.addEventListener('click', () => {
      if (currentSession && currentSession.vpaAddress) {
        navigator.clipboard.writeText(currentSession.vpaAddress).then(() => {
          const orig = vpaAddress.textContent;
          vpaAddress.textContent = 'Copied to Clipboard!';
          setTimeout(() => vpaAddress.textContent = orig, 1200);
        });
      }
    });

    utrInput.addEventListener('input', () => {
      utrInput.value = utrInput.value.replace(/\D/g, '').slice(0, 12);
    });

    utrInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        verifyPayment();
      }
    });

    // Start
    initSession();
  </script>
</body>
</html>
